<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>安装日报平台</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">📋 安装日报平台</div>
    <div class="mode-badge" id="modeBadge">演示模式</div>
  </header>

  <div class="banner-demo hidden" id="demoBanner">
    ⚠️ 当前为<b>演示模式</b>：数据仅保存在本机浏览器，清缓存 / 换手机 / 重装浏览器都会丢失。
    正式每日使用请按《部署清单》切换到<b>云端模式</b>（数据存云端，不会丢）。
  </div>

  <nav class="tabs">
    <button class="tab active" data-tab="report">技术员上报</button>
    <button class="tab" data-tab="manage">管理后台</button>
  </nav>

  <!-- 上报 -->
  <main id="tab-report" class="tabpane active">
    <form id="reportForm" class="card">
      <label>项目
        <span class="inline">
          <select id="projectSelect" required></select>
          <button type="button" id="addProjectBtn" class="link">+新建</button>
        </span>
      </label>
      <label>技术员姓名 <input id="techName" required placeholder="如：张工"></label>
      <label>日期 <input id="reportDate" type="date" required></label>
      <label>天气 <input id="weather" placeholder="如：晴 26℃"></label>
      <label>今日完成工作 <textarea id="todayWork" rows="4" required placeholder="逐条记录，一行一项"></textarea></label>
      <label>明日计划 <textarea id="tomorrowPlan" rows="3"></textarea></label>
      <label>进度 % <input id="progress" type="number" min="0" max="100" placeholder="0-100"></label>
      <label>问题 / 待解决 <textarea id="issues" rows="3"></textarea></label>
      <label>现场照片（可多选：手机拍照或相册）
        <input id="photoInput" type="file" accept="image/*" multiple>
      </label>
      <div id="photoPreview" class="photo-preview"></div>
      <button type="submit" class="btn primary">提交日报</button>
      <div id="reportMsg" class="msg"></div>
    </form>
    <p class="hint">提示：演示模式下数据只存在本机浏览器。要技术员在当地用手机实时上传，请在 config.js 填入 Supabase 凭证切换到云端模式。</p>
  </main>

  <!-- 管理 -->
  <main id="tab-manage" class="tabpane">
    <div id="adminGate" class="card">
      <p>请输入管理访问码：</p>
      <input id="adminCode" type="password">
      <button id="adminEnter" class="btn">进入</button>
      <div id="adminErr" class="msg err"></div>
    </div>
    <div id="adminPanel" class="hidden">
      <div class="card filters">
        <label>项目 <select id="filterProject"></select></label>
        <label>起 <input id="filterFrom" type="date"></label>
        <label>止 <input id="filterTo" type="date"></label>
        <label>技术员 <input id="filterTech" placeholder="留空=全部"></label>
        <div class="btn-row">
          <button id="applyFilter" class="btn">筛选</button>
          <button id="exportExcelBtn" class="btn">导出 Excel</button>
          <button id="downloadZipBtn" class="btn">下载全部照片</button>
          <button id="backupExportBtn" class="btn ghost hidden">导出本机备份</button>
          <button id="backupImportBtn" class="btn ghost hidden">导入备份</button>
          <input id="backupFile" type="file" accept="application/json" class="hidden">
        </div>
      </div>
      <div id="reportList" class="report-list"></div>
    </div>
  </main>

  <!-- 详情/编辑弹窗 -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <button id="modalClose" class="modal-close">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="vendor/xlsx.full.min.js"></script>
  <script src="vendor/jszip.min.js"></script>
  <script>
    // 页面脚本出错时，直接在页面顶部显示红字，方便排查（无需打开开发者工具）
    window.addEventListener('error', function (e) {
      var b = document.getElementById('errBanner');
      if (!b) {
        b = document.createElement('div');
        b.id = 'errBanner';
        b.className = 'banner-demo';
        document.body.insertBefore(b, document.body.firstChild);
      }
      var file = (e.filename || '').split('/').pop() || '';
      b.innerHTML = '⚠️ 页面脚本出错：' + (e.message || e.type) + (file ? '（' + file + '）' : '');
    });
  </script>
  <script src="config.js?v=20260904b"></script>
  <script src="db.js?v=20260904b"></script>
  <script src="export.js?v=20260904b"></script>
  <script src="app.js?v=20260904b"></script>
</body>
</html>
